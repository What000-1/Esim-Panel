# 这个名字决定了你最终的 API 链接前缀，比如 https://esim-api.你的用户名.workers.dev
name = "esim-api"

# 明确告诉 Cloudflare 我们后端代码的准确路径
main = "worker/entry.js"

# 固定已验证的兼容性日期
compatibility_date = "2026-05-31"

[build]
command = "npm run build"

[[durable_objects.bindings]]
name = "ESIM_STORE"
class_name = "EsimStore"

[[migrations]]
tag = "v2-sqlite-store"
new_sqlite_classes = ["EsimStore"]

# 记录请求与定时提醒的运行结果
[observability]
enabled = true

# 自动配置定时任务（每天 UTC 02:00，北京时间 10:00）
[triggers]
crons = ["0 2 * * *"]

# 从本仓库 7ec88b9 的历史配置恢复原 ESIM_DB，供首次迁移读取旧数据。
# Namespace ID 是标识符，不是访问密钥；不要新建空 namespace 替换原绑定。
[[kv_namespaces]]
binding = "ESIM_DB"
id = "2e0c3bc7b63f4494820316a7ef02b60d"
